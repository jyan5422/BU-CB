[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# cm_pass: allow a discard with nothing selected, as the Big 2 pass.
#
# can_discard greys the button out when #G.hand.highlighted <= 0. That one
# condition is the only thing preventing a zero-card discard; the discard path
# itself already handles it, counting #cards generically and spending one
# discard. Normal discards are untouched.
[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "if G.GAME.current_round.discards_left <= 0 or #G.hand.highlighted <= 0 or #G.hand.highlighted > math.max(G.GAME.starting_params.discard_limit, 0) then"
position = "at"
payload = "if G.GAME.current_round.discards_left <= 0 or (#G.hand.highlighted <= 0 and not (G.GAME.modifiers and G.GAME.modifiers.cm_pass)) or #G.hand.highlighted > math.max(G.GAME.starting_params.discard_limit, 0) then"
match_indent = true
overwrite = true

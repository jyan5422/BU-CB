[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Carried over from challenge_init.toml, which the SMODS build drops: the rest
# of that file bootstraps the Lovely entry point (ChallengeMod.lua owns it now),
# but this patch is still needed so v.hidden daily modifiers stay out of the
# rules box and rule text picks up both vars.
[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "game_rules[#game_rules+1]*v.id*"
position = "at"
payload = '''
if (not v.hidden) then game_rules[#game_rules+1] = {n=G.UIT.R, config={align = "cl"}, nodes= localize{type = 'text', key = 'ch_c_'..v.id, vars = {v.value, v.name}}} end
'''
match_indent = true
overwrite = true

[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Append context to the hand name shown while cards are selected.
#
# The game says only "will not score" when a hand is rejected, which does not
# say why or what to do. This adds the climb state -- how many cards the
# current climb needs, and that a discard resets it -- and the shed bonus when
# the selection would empty the hand.
#
# Patched where the selection display is built (CardArea:add_to_highlighted),
# right after debuff_hand has been asked and disp_text chosen, so the text is
# permanent context rather than a popup that fades.
[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "update_hand_text({immediate = true, nopulse = nil, delay = 0}, {handname=disp_text, level=G.GAME.hands[text].level, mult = G.GAME.hands[text].mult, chips = G.GAME.hands[text].chips})"
position = "at"
payload = """
local _cm_name = disp_text
if ChallengeMod and ChallengeMod.Climb and ChallengeMod.Climb.hand_suffix then
  _cm_name = _cm_name .. (ChallengeMod.Climb.hand_suffix(self.highlighted, text) or '')
end
update_hand_text({immediate = true, nopulse = nil, delay = 0}, {handname=_cm_name, level=G.GAME.hands[text].level, mult = G.GAME.hands[text].mult, chips = G.GAME.hands[text].chips})
"""
match_indent = true
overwrite = true

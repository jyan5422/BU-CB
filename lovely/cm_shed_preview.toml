[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Show the shed bonus in the mult preview while cards are selected.
#
# The preview sets mult from G.GAME.hands[text].mult, which knows nothing about
# the bonus, so a selection that would empty the hand showed its ordinary mult
# and the payout was invisible until after committing.
#
# Only the displayed number changes here. The bonus itself is applied during
# scoring by cm_shed_bonus.toml -- this must not double-count it.
[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = "update_hand_text({immediate = true, nopulse = nil, delay = 0}, {handname=disp_text, level=G.GAME.hands[text].level, mult = G.GAME.hands[text].mult, chips = G.GAME.hands[text].chips})"
position = "at"
payload = """
local _cm_mult = G.GAME.hands[text].mult
if ChallengeMod and ChallengeMod.Climb and ChallengeMod.Climb.shed_preview_xmult then
  local _cm_x = ChallengeMod.Climb.shed_preview_xmult(self, text)
  _cm_mult = _cm_mult * _cm_x
end
-- One announcement for everything the selection is worth: the shed payout and
-- the waste charge would otherwise be two forced alerts at the same spot.
-- Done here because `text` and `poker_hands` are both in scope and nowhere
-- better is.
if ChallengeMod and ChallengeMod.Climb and ChallengeMod.Climb.selection_flash then
  local _cm_waste = 0
  if ChallengeMod.Waste and ChallengeMod.Waste.preview then
    _cm_waste = ChallengeMod.Waste.preview(self, text, poker_hands) or 0
  end
  ChallengeMod.Climb.selection_flash(_cm_x, _cm_waste)
end
update_hand_text({immediate = true, nopulse = nil, delay = 0}, {handname=disp_text, level=G.GAME.hands[text].level, mult = _cm_mult, chips = G.GAME.hands[text].chips})
"""
match_indent = true
overwrite = true

[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "nuGC(nil, nil, true)"
position = "after"
payload = """
if G.GAME and G.GAME.modifiers and G.GAME.modifiers.cm_all_facedown == true then G.debug_tooltip_toggle = true else G.debug_tooltip_toggle = false end
"""
match_indent = true
overwrite = false

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = """self.facing = 'front'"""
position = "after"
payload = """if ChallengeMod and ChallengeMod.DEBUG then
ChallengeMod.DEBUG.card_init_calls = ChallengeMod.DEBUG.card_init_calls + 1 end
if G.GAME and G.GAME.modifiers and G.GAME.modifiers.cm_all_facedown == true then
self.facing = 'back'
if ChallengeMod and ChallengeMod.DEBUG then
ChallengeMod.DEBUG.facedown_fired = ChallengeMod.DEBUG.facedown_fired + 1 end
end"""
match_indent = true
overwrite = false

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = """self.sprite_facing = 'front'"""
position = "after"
payload = """if G.GAME and G.GAME.modifiers and G.GAME.modifiers.cm_all_facedown == true then
self.sprite_facing = 'back' end"""
match_indent = true
overwrite = false

[[patches]]
[patches.pattern]
target = "cardarea.lua"
# stay_flipped gained an `area` argument in 1.0.1o.
pattern = "local stay_flipped = G.GAME and G.GAME.blind and G.GAME.blind:stay_flipped(self, card, area)"
position = "before"
payload = """
if G.GAME and G.GAME.modifiers and G.GAME.modifiers.cm_all_facedown == true then
card.facing = 'front'
card.sprite_facing = 'front'
end
"""
match_indent = true
overwrite = false

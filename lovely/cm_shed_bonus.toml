[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# cm_shed_bonus: multiply the finished mult when the hand is emptied.
#
# Patched at the final scoring step rather than wrapping mod_mult. mod_mult runs
# several times per hand -- base mult, post-joker, final step -- so a
# once-per-hand guard caught the first call and the bonus scaled the BASE mult,
# with every joker afterwards compounding on top. Here `mult` is the finished
# total, and `mult` itself is a local so it can only be reached by patching.
#
# SMODS.Scoring_Parameters.mult.current has to be written too: the round score
# comes from SMODS.calculate_round_score, which reads that parameter rather
# than this local. Setting only the local moved the on-screen mult from x1 to
# x3 while the round score stayed put -- observed in play.
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "hand_chips = mod_chips(nu_chip or hand_chips)"
position = "after"
payload = """
if ChallengeMod and ChallengeMod.Climb and ChallengeMod.Climb.shed_multiplier then
  local _x = ChallengeMod.Climb.shed_multiplier()
  if _x and _x > 1 then
    mult = mult * _x
    -- The score is totalled from SMODS.Scoring_Parameters, not this local, so
    -- updating `mult` alone changed the display and nothing else.
    if SMODS and SMODS.Scoring_Parameters and SMODS.Scoring_Parameters.mult then
      SMODS.Scoring_Parameters.mult.current = mult
    end
    -- The flash itself lives in smods/rules_climb_wiring.lua so the anchoring
    -- stays in one place. It used to go through card_eval_status_text here,
    -- announcing like a joker, but that pins the text to a card -- it drew off
    -- to one side and slid with the scoring animation.
    if ChallengeMod.Climb.shed_flash then ChallengeMod.Climb.shed_flash(_x) end
    update_hand_text({ delay = 0 }, { mult = mult })
  end
end
"""
match_indent = true
overwrite = false

[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "blind.lua"
# Anchored after self.name is set, not before self.config.blind. get_type()
# derives the type from self.name, so running earlier tested the *previous*
# blind -- empty on the first one, so it never matched 'Boss'. The game's own
# no_blind_reward check sits right here for the same reason.
pattern = "self.dollars = blind and blind.dollars or 0"
position = "before"
payload = """
if ChallengeMod and ChallengeMod.DEBUG then
  ChallengeMod.DEBUG.set_blind_calls = ChallengeMod.DEBUG.set_blind_calls + 1
  -- get_type() has no else branch: it returns NOTHING when self.name is
  -- empty, so tostring() would be called with no argument and error.
  local _t = self:get_type()
  ChallengeMod.DEBUG.last_blind_type = _t == nil and "nil" or tostring(_t)
end
if G.GAME and G.GAME.modifiers and G.GAME.modifiers.cm_decreasing_handsize and self:get_type() == 'Boss' and G.hand then
  G.hand:change_size(-G.GAME.modifiers.cm_decreasing_handsize)
  if ChallengeMod and ChallengeMod.DEBUG then
    ChallengeMod.DEBUG.handsize_fired = ChallengeMod.DEBUG.handsize_fired + 1
  end
end
"""
match_indent = true
overwrite = false
[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "blind.lua"
# Anchored after self.name is set, not before self.config.blind. get_type()
# derives the type from self.name, so running earlier tested the *previous*
# blind -- empty on the first one, so it never matched 'Boss'. The game's own
# no_blind_reward check sits right here for the same reason.
pattern = "self.dollars = blind and blind.dollars or 0"
position = "before"
payload = """
if G.GAME.modifiers.cm_decreasing_handsize and self:get_type() == 'Boss' and G.hand then
  G.hand:change_size(-G.GAME.modifiers.cm_decreasing_handsize)
end
"""
match_indent = true
overwrite = false